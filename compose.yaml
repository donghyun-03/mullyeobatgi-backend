services:
  mysql:
    image: 'mysql:8.4'
    container_name: mullyeobatgi-mysql
    environment:
      - 'MYSQL_DATABASE=mullyeobatgi'
      - 'MYSQL_USER=mullyeobatgi'
      - 'MYSQL_PASSWORD=mullyeobatgi'
      - 'MYSQL_ROOT_PASSWORD=root'
      - 'TZ=Asia/Seoul'
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
    # 이 PC에 이미 MySQL 이 3306 을 쓰고 있어서 3307 로 연다
    ports:
      - '3307:3306'
    volumes:
      - 'mysql-data:/var/lib/mysql'

volumes:
  mysql-data:
