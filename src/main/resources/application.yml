spring:
  application:
    name: mullyeobatgi
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mullyeobatgi}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:mullyeobatgi}
    password: ${DB_PASSWORD:mullyeobatgi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
  jackson:
    deserialization:
      # 프론트가 선택 항목(숫자·true/false)을 빼고 보내도 0 / false 로 받는다 (Jackson 3 기본값은 400 오류)
      FAIL_ON_NULL_FOR_PRIMITIVES: false
  servlet:
    multipart:
      # 체크리스트 서류는 5MB까지 (ChecklistService 에서도 한 번 더 확인)
      max-file-size: 5MB
      max-request-size: 6MB
  docker:
    compose:
      # 앱을 끌 때 DB 컨테이너는 그대로 둔다
      lifecycle-management: start-only
  ai:
    model:
      # API 키를 받으면 AI_CHAT_MODEL=anthropic 과 ANTHROPIC_API_KEY 를 넣는다. none 이면 템플릿으로 동작한다.
      chat: ${AI_CHAT_MODEL:none}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
          max-tokens: 2000

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  zone: Asia/Seoul
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  auth:
    # 시연용 로그인. 실제 배포에서 카카오 로그인만 쓰려면 false
    dev-login-enabled: ${DEV_LOGIN_ENABLED:true}
    token-valid-days: 30
  demo:
    # DB가 비어 있으면 예시 사장님·청년 데이터를 넣는다
    seed: ${DEMO_SEED:true}
